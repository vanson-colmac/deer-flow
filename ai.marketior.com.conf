<VirtualHost *:80>
    ServerName ai.marketior.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName ai.marketior.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ai.marketior.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ai.marketior.com/privkey.pem

    # API + LangGraph requests → Gateway backend
    ProxyPass /api http://127.0.0.1:8001/api
    ProxyPassReverse /api http://127.0.0.1:8001/api

    # WebSocket support (streaming responses)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:8001/$1 [P,L]

    # Everything else → Frontend
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Headers
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On

    # Timeouts for long-running AI requests
    ProxyTimeout 600
    TimeOut 600
</VirtualHost>
